name: Frontend CI
on:
  push:
    branches: [main, dev, 'codex/**', 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Phát hành image SHA lên GHCR sau khi toàn bộ kiểm tra đạt'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run contract:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
      - run: docker build -t servicedesk-web:ci .

  publish:
    name: Phát hành image bất biến
    needs: frontend
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.repository_owner == 'supportflow-ai' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: servicedesk-web
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/supportflow-ai/${{ matrix.image }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Ghi bằng chứng digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Thiếu digest hợp lệ; không tạo bằng chứng phát hành.")
          image = os.environ["IMAGE"]
          output = pathlib.Path("artifacts") / (image + ".json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps({
              "repository": os.environ["SOURCE_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "images": {image: "ghcr.io/supportflow-ai/" + image + "@" + digest}
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-${{ matrix.image }}-${{ github.sha }}
          path: artifacts/*.json
