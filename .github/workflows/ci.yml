name: Frontend CI
on:
  push:
    branches: [main, dev, 'codex/**', 'feature/**', 'devops/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
      - run: docker build -t servicedesk-web:ci .

  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: frontend
    if: github.repository_owner == 'supportflow-ai' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/devops/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push Web image
        id: build-web
        run: |
          IMAGE="ghcr.io/supportflow-ai/servicedesk-web:sha-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null | awk -F'@' '{print $2}')
          echo "web_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Web Digest: $DIGEST"
      - name: Record published web artifact digest
        run: |
          mkdir -p artifacts/ghcr
          cat <<EOF > artifacts/ghcr/web-digest.json
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": {
              "web": "ghcr.io/supportflow-ai/servicedesk-web@${{ steps.build-web.outputs.web_digest }}"
            }
          }
          EOF
          cat artifacts/ghcr/web-digest.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-ghcr-digest-${{ github.sha }}
          path: artifacts/ghcr/web-digest.json
